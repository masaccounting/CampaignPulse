<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampaignPulse | Launching Soon</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 30, 49, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b, var(--bg));
      color: var(--text);
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 48px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 24px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status-panel {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      font-size: 14px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label {
      color: var(--text-muted);
    }

    .status-value {
      color: #e2e8f0;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="pulse-dot"></span>
      Deployment Pipeline Active
    </div>
    <h1>CampaignPulse</h1>
    <p class="subtitle">Real-time political & marketing intelligence. Automated continuous deployment pipeline is live.</p>
    
    <div class="status-panel">
      <div class="status-item">
        <span class="status-label">Hosting:</span>
        <span class="status-value">Vercel Edge</span>
      </div>
      <div class="status-item">
        <span class="status-label">Source Control:</span>
        <span class="status-value">GitHub (main)</span>
      </div>
      <div class="status-item">
        <span class="status-label">CD Automation:</span>
        <span class="status-value">Triggered on push</span>
      </div>
    </div>

    <div class="footer">
      &copy; CampaignPulse &bull; Auto-deployed via GitHub &rarr; Vercel
    </div>
  </div>
</body>
</html>
